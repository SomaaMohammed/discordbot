name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate on Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: tsbot/package-lock.json

      - name: Install dependencies
        working-directory: tsbot
        run: npm ci

      - name: Validate operations shell
        run: |
          bash -n ops.sh
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes shellcheck
          fi
          shellcheck ops.sh

      - name: Validate PowerShell syntax
        working-directory: tsbot
        run: npm run powershell:check

      - name: Check local documentation links
        working-directory: tsbot
        run: npm run docs:links

      - name: Check formatting
        working-directory: tsbot
        run: npm run format:check

      - name: Verify authoritative version identity
        working-directory: tsbot
        run: npm run version:verify

      - name: Security checks
        working-directory: tsbot
        run: npm run security:check

      - name: Typecheck
        working-directory: tsbot
        run: npm run typecheck

      - name: Tests
        working-directory: tsbot
        run: npm test

      - name: Build production JavaScript
        working-directory: tsbot
        run: npm run build

      - name: Verify clean production output
        working-directory: tsbot
        run: |
          test -f dist/src/index.js
          test ! -d dist/tests
          find dist/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check whitespace errors
        run: git diff --check

  windows-portable:
    name: Build Windows portable artifact
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: tsbot/package-lock.json

      - name: Install build dependencies
        working-directory: tsbot
        run: npm ci

      - name: Reject a stale committed executable before rebuilding
        working-directory: tsbot
        run: npm run artifact:verify

      - name: Build portable Windows x64 ZIP twice reproducibly
        working-directory: tsbot
        run: npm run package:win:verify

      - name: Smoke-test launchers and native SQLite
        shell: pwsh
        run: |
          $archive = Get-ChildItem -LiteralPath ./release -Filter 'SuperiorBot-*-win-x64.zip'
          if (@($archive).Count -ne 1) { throw "Expected exactly one portable ZIP." }
          ./windows/test-portable.ps1 -Artifact $archive.FullName

      - name: Smoke-test standalone executable
        shell: pwsh
        run: ./windows/test-standalone.ps1 -Executable ./SuperiorBot.exe

      - name: Verify committed executable is reproducible
        run: git diff --exit-code -- SuperiorBot.exe

      - name: Upload portable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SuperiorBot-win-x64
          path: |
            SuperiorBot.exe
            release/SuperiorBot-*-win-x64.zip
            release/SuperiorBot-*-win-x64.zip.sha256
          if-no-files-found: error
