name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate operations shell
        run: |
          bash -n ops.sh
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes shellcheck
          fi
          shellcheck ops.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: tsbot/package-lock.json

      - name: Install dependencies
        run: |
          cd tsbot
          npm ci

      - name: Validate JSON files
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('data/bootstrap/questions.json','utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('data/bootstrap/answers.json','utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('data/bootstrap/state.json','utf8'))"

      - name: Check formatting
        run: |
          cd tsbot
          npm run format:check

      - name: Typecheck
        run: |
          cd tsbot
          npm run typecheck

      - name: Tests
        run: |
          cd tsbot
          npm test

      - name: Build
        run: |
          cd tsbot
          npm run build
